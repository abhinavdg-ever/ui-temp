services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      DATA_MODE: ${DATA_MODE:-local}
      DATA_ROOT: /data/folders
      # Local-mode Manifest Details CSVs (06-postgres-db/manifest on laptop)
      METADATA_ROOT: /data/manifest
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://user:password@localhost:5432/advantmed_imaging}
      FILE_VIEWER_BLOB_ENABLED: ${FILE_VIEWER_BLOB_ENABLED:-false}
      BLOB_AUTH_MODE: ${BLOB_AUTH_MODE:-entra}
      BLOB_ACCOUNT_URL: ${BLOB_ACCOUNT_URL:-}
      BLOB_CONTAINER: ${BLOB_CONTAINER:-}
      BLOB_PATH_TEMPLATE: ${BLOB_PATH_TEMPLATE:-{folder}/pages/{filename}}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      BLOB_SAS_TOKEN: ${BLOB_SAS_TOKEN:-}
    volumes:
      # Host document folders → container path used by DATA_ROOT
      - ${DATA_HOST_PATH:-./data/folders}:/data/folders:ro
      # Manifest CSVs for DATA_MODE=local (monorepo: ../06-postgres-db/manifest)
      - ${METADATA_HOST_PATH:-./postgres-db/manifest}:/data/manifest:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped
