services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      DATA_MODE: ${DATA_MODE:-local}
      DATA_ROOT: /data/folders
      # Local-mode Manifest Details CSVs (sibling 06-postgres-db/manifest)
      METADATA_ROOT: /data/manifest
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
      # POC Postgres: database imaging_outputs, schema public @ 172.20.4.170
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aiuser:passwordpoc2026@172.20.4.170:5432/imaging_outputs}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      FILE_VIEWER_BLOB_ENABLED: ${FILE_VIEWER_BLOB_ENABLED:-false}
      BLOB_AUTH_MODE: ${BLOB_AUTH_MODE:-entra}
      BLOB_ACCOUNT_URL: ${BLOB_ACCOUNT_URL:-}
      BLOB_CONTAINER: ${BLOB_CONTAINER:-}
      BLOB_PATH_TEMPLATE: ${BLOB_PATH_TEMPLATE:-{folder}/pages/{filename}}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      BLOB_SAS_TOKEN: ${BLOB_SAS_TOKEN:-}
    volumes:
      - ${DATA_HOST_PATH:-./data/folders}:/data/folders:ro
      - ${METADATA_HOST_PATH:-../06-postgres-db/manifest}:/data/manifest:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped
